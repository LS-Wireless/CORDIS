; CORDIS test suite configuration.
;
; Gate:   pytest -W error          must be clean (all markers)
; Fast:   pytest -m "not slow"     must stay under ~60 s
;
; Note on the `ignore:invalid escape sequence` filter below:
;   cordis/plotting/cdf.py:46 opens a non-raw docstring that contains "\%".
;   CPython raises SyntaxWarning when compiling it, which -W error promotes to
;   SyntaxError, so `import cordis.plotting` fails on a cold __pycache__.
;   Tracked as F-00-01 in .local/verification/findings.md.
;   DELETE that filter line once F-00-01 is corrected, the suite has an
;   xfail(strict=True) case in tests/test_source_hygiene.py that will fail
;   loudly at that point to remind you.
; Comments cannot live inside a multi-line ini value, hence this preamble.

[pytest]
testpaths = tests
filterwarnings =
    error
    ignore:invalid escape sequence:SyntaxWarning
markers =
    slow: takes more than ~5 s
    solver: requires CVXPY and exercises a real solve
    regression: pins a numeric value from a stored campaign
    integration: crosses more than one package layer
addopts = --strict-markers
